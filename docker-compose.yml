services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tracechain
      POSTGRES_USER: tracechain_admin
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tracechain_schema.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata: